  role: Machine Learning Developer
  period: August 2024 - Present
  summary: Production machine learning for visual effects across feature-film and commercial workflows.
  responsibilities_title: Machine Learning Work
  responsibilities:
    - title: Performance transfer and face replacement
      summary: Develop production workflows that preserve facial performance while adapting an actor's appearance for visual-effects shots.
    - title: ComfyUI and generative pipelines
      summary: Build custom ComfyUI nodes and maintain generative workflows designed for production use.
    - title: Maya and performance capture
      summary: Connect model outputs to Maya facial rigs and extend performance-capture workflows with gaze estimation.
    - title: Shot-specific ML solutions
      summary: Develop purpose-built approaches for shot stitching, outpainting, and slow-motion generation with production supervisors.
    - title: Production datasets and knowledge sharing
      summary: Prepare large image datasets, document workflows, and present the team's machine-learning work to technical and student audiences.
